<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录设备管理 - 星云有客</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#252a34;background:#f5f6f8;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:320px;font-size:14px}.topbar{height:60px;background:#fff;border-bottom:1px solid #eceef2;display:flex;align-items:center;padding:0 24px;gap:22px;position:sticky;top:0;z-index:3}.brand{font-size:24px;font-weight:750;color:#2874f0;letter-spacing:1px;white-space:nowrap}.brand-mark{font-size:29px;margin-right:6px;vertical-align:-2px}.app-grid{color:#b8bfce;font-size:17px}.search{height:34px;width:240px;border-radius:18px;background:#f6f7f9;color:#b0b5bf;padding:8px 14px}.top-spacer{flex:1}.env{border:1px solid #f0d145;background:#fff9d4;color:#836c00;padding:5px 10px;font-size:13px}.top-icon{color:#697589;font-size:17px}.avatar{width:32px;height:32px;border-radius:5px;background:linear-gradient(135deg,#c8d4e3,#526a84);color:#fff;display:grid;place-items:center;font-size:12px}.user{line-height:1.35;color:#525a68;font-size:12px;min-width:62px}.user strong{display:block;color:#252a34;font-size:13px}.layout{display:flex;min-height:calc(100vh - 60px)}.rail{width:58px;background:#f7f8fb;border-right:1px solid #edf0f4;display:flex;align-items:center;flex-direction:column;padding:12px 0;gap:4px;flex-shrink:0}.rail-item{width:50px;height:54px;color:#99a2b6;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:4px}.rail-item .ico{font-size:20px;line-height:20px}.rail-item.selected{color:#2874f0;background:#eaf2ff;font-weight:600}.subnav{width:144px;background:#fff;border-right:1px solid #eef0f3;padding:18px 10px;flex-shrink:0}.nav-title{font-weight:600;color:#394252;padding:8px 12px 12px;border-bottom:1px solid #f0f1f4;margin-bottom:6px}.subitem{padding:10px 12px;color:#737b89;border-radius:4px;margin:2px 0;font-size:13px}.subitem.active{color:#2874f0;background:#eff5ff}.main{flex:1;min-width:0;padding:16px 20px 28px}.tabs{background:#fff;min-height:64px;padding:0 24px;display:flex;align-items:center;gap:34px;border-radius:2px;margin-bottom:16px}.tab{height:64px;display:flex;align-items:center;position:relative;color:#626b79;font-weight:500;cursor:pointer;white-space:nowrap}.tab.active{color:#202633;font-weight:650}.tab.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#2874f0;border-radius:3px 3px 0 0}.panel{background:#fff;min-height:calc(100vh - 156px);padding:30px 36px;border-radius:2px}.content{max-width:1000px;margin:0 auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{font-size:18px;margin:0 0 8px;font-weight:600;color:#252a34}.heading p{margin:0;color:#808895;font-size:13px;line-height:1.7}.count{font-size:12px;color:#7b8492;background:#f5f7fa;border-radius:12px;padding:5px 10px;white-space:nowrap}.device-list{border-top:1px solid #eceff3}.device{display:flex;align-items:center;gap:18px;padding:21px 10px;border-bottom:1px solid #eceff3;min-height:105px}.device-icon{width:46px;height:46px;border:1px solid #e4e8ef;border-radius:10px;background:#f8fafc;display:grid;place-items:center;color:#677992;flex-shrink:0}.device-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.device-info{min-width:0;flex:1}.device-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px;font-size:14px;font-weight:600;color:#333b49}.current{border-radius:3px;padding:2px 6px;background:#eaf6ef;color:#29935a;font-size:11px;font-weight:500}.device-meta{display:flex;gap:16px;flex-wrap:wrap;color:#818a98;font-size:12px;line-height:1.6}.device-meta span+span:before{content:"·";margin-right:16px;color:#c1c7d0}.last-login{width:170px;flex-shrink:0;color:#6f7886;font-size:12px;line-height:1.7}.last-login label{display:block;color:#a0a7b2;font-size:11px}.remove{width:58px;height:30px;border:1px solid #e2e6ec;background:#fff;color:#67707e;border-radius:4px;font-size:12px;cursor:pointer;flex-shrink:0}.remove:hover{border-color:#e49a9a;color:#d84b4b;background:#fffafa}.footnote{margin-top:18px;color:#969daa;font-size:12px;line-height:1.7}.empty{padding:56px 12px;text-align:center;color:#9299a5}.modal-backdrop{position:fixed;inset:0;z-index:9;background:rgba(20,27,39,.42);display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;width:min(420px,100%);border-radius:8px;box-shadow:0 12px 40px #14203733;padding:24px}.modal h2{font-size:16px;margin:0 0 13px;color:#252a34}.modal p{font-size:14px;line-height:1.75;margin:0;color:#5e6673}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}.btn{height:34px;padding:0 17px;border-radius:4px;font-size:13px;cursor:pointer}.btn-secondary{background:#fff;border:1px solid #dfe3e9;color:#5f6774}.btn-danger{background:#2874f0;border:1px solid #2874f0;color:white}.toast{position:fixed;z-index:10;top:76px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e6e9ee;box-shadow:0 4px 18px #1a29401c;padding:10px 18px;border-radius:5px;color:#388256;font-size:13px}.hidden{display:none!important}
    @media(max-width:800px){.search{display:none}.topbar{padding:0 12px;gap:12px}.brand{font-size:19px}.env{font-size:11px}.subnav{width:112px}.main{padding:12px}.panel{padding:22px 16px}.tabs{padding:0 18px;gap:24px}.device{gap:12px;padding:18px 2px}.last-login{width:140px}.device-meta{gap:8px}.device-meta span+span:before{margin-right:8px}}
    @media(max-width:560px){.rail{width:48px}.rail-item{width:42px}.subnav{width:94px;padding:14px 6px}.nav-title,.subitem{padding-left:8px;padding-right:8px;font-size:12px}.top-icon,.app-grid{display:none}.user{display:none}.tabs{gap:20px;padding:0 14px;min-height:56px}.tab{height:56px;font-size:13px}.heading{margin-bottom:16px}.device{align-items:flex-start;flex-wrap:wrap}.device-icon{width:40px;height:40px}.device-info{width:calc(100% - 56px);flex:none}.last-login{margin-left:52px;width:auto;flex:1}.remove{margin-left:auto}.device-meta{gap:5px}.device-meta span+span:before{margin-right:5px}.panel{min-height:calc(100vh - 136px)}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">◢</span>星云有客</div><div class="app-grid">▦</div><div class="search">⌕&nbsp; 智能搜索</div><div class="top-spacer"></div><div class="env">当前环境：Test01</div><span class="top-icon">◉</span><span class="top-icon">⬟</span><span class="top-icon">ⓘ</span><span class="top-icon">♧</span><div class="avatar">帅</div><div class="user"><strong>帅庆</strong>杭州星云科技...</div><span class="top-icon">⌄</span></header>
  <div class="layout"><aside class="rail"><div class="rail-item"><span class="ico">⌂</span>首页</div><div class="rail-item"><span class="ico">♙</span>获客</div><div class="rail-item"><span class="ico">➤</span>触达</div><div class="rail-item"><span class="ico">♧</span>用户</div><div class="rail-item"><span class="ico">⌂</span>小店</div><div class="rail-item"><span class="ico">▱</span>内容</div><div class="rail-item"><span class="ico">✣</span>AI</div><div class="rail-item"><span class="ico">♧</span>营销</div><div class="rail-item"><span class="ico">▽</span>视频号</div><div class="rail-item selected"><span class="ico">▦</span>管理</div><div class="rail-item"><span class="ico">⬡</span>应用</div></aside><aside class="subnav"><div class="nav-title">账号管理</div><div class="subitem">企业成员</div><div class="subitem">门店管理</div><div class="subitem">员工管理</div><div class="subitem">账号设置</div></aside>
    <main class="main"><nav class="tabs"><div class="tab" data-tab="account">账号设置</div><div class="tab active" data-tab="devices">登录设备</div></nav><section class="panel"><div class="content" id="deviceView"><div class="heading"><div><h1>登录设备</h1><p>查看近期登录过此账号的设备。移除设备后，该设备再次登录时需要企微扫码验证。</p></div><span class="count" id="deviceCount"></span></div><div class="device-list" id="deviceList"></div></div><div class="content hidden" id="accountView"><div class="heading"><div><h1>账号设置</h1><p>管理账号安全信息与登录凭证。</p></div></div><div style="padding:28px 0;color:#687180">角色：开发、测试专用角色<br><br>手机号：173****5766<br><br>此原型仅展示登录设备管理流程。</div></div></section></main>
  </div>
  <div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
  <script>
    const ua=navigator.userAgent;const isMac=/Macintosh|Mac OS X/.test(ua),isWindows=/Windows/.test(ua),isAndroid=/Android/.test(ua),isIOS=/iPhone|iPad|iPod/.test(ua);const os=isIOS?'iOS':isAndroid?'Android':isMac?'macOS':isWindows?'Windows':'其他系统';const browser=/Edg\//.test(ua)?'Microsoft Edge':/Firefox\//.test(ua)?'Mozilla Firefox':/Chrome\//.test(ua)?'Google Chrome':/Safari\//.test(ua)?'Safari':'未知浏览器';const deviceType=isIOS||isAndroid?'手机/平板':'电脑';
    const devices=[{id:'current',name:`${deviceType} · ${os}`,browser,system:os,last:'刚刚',current:true},{id:'d2',name:'电脑 · Windows',browser:'Google Chrome',system:'Windows 11',last:'2026-10-28 16:42'},{id:'d3',name:'手机 · iOS',browser:'Safari',system:'iOS',last:'2026-10-26 09:18'}];let pendingId=null;
    const icon=(mobile)=>mobile?'<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.2"/><path d="M10 18.5h4"/></svg>':'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="1.5"/><path d="M8 21h8m-4-4v4M2 17h20"/></svg>';
    function render(){const list=document.querySelector('#deviceList');document.querySelector('#deviceCount').textContent=`${devices.length} 台设备`;list.innerHTML=devices.length?devices.map(d=>`<article class="device"><div class="device-icon">${icon(/手机|平板/.test(d.name))}</div><div class="device-info"><div class="device-title">${d.name}${d.current?'<span class="current">当前设备</span>':''}</div><div class="device-meta"><span>${d.browser}</span><span>${d.system}</span></div></div><div class="last-login"><label>最近登录时间</label>${d.last}</div><button class="remove" data-remove="${d.id}">移除</button></article>`).join(''):'<div class="empty">暂无登录设备</div>';list.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>confirmRemove(b.dataset.remove)))}
    function confirmRemove(id){pendingId=id;document.querySelector('#modalRoot').innerHTML='<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><h2 id="confirmTitle">移除登录设备</h2><p>是否确认移除？移除后再次在该设备登录时，需要企微扫码验证。</p><div class="modal-actions"><button class="btn btn-secondary" data-cancel>取消</button><button class="btn btn-danger" data-confirm>确认移除</button></div></section></div>';document.querySelector('[data-cancel]').onclick=closeModal;document.querySelector('[data-confirm]').onclick=removeDevice;document.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});document.addEventListener('keydown',esc)}
    function esc(e){if(e.key==='Escape')closeModal()}function closeModal(){document.querySelector('#modalRoot').innerHTML='';document.removeEventListener('keydown',esc);pendingId=null}function removeDevice(){const d=devices.find(x=>x.id===pendingId);if(!d)return;devices.splice(devices.indexOf(d),1);closeModal();render();const toast=document.querySelector('#toast');toast.textContent='设备已移除';toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2200)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelector('#deviceView').classList.toggle('hidden',t.dataset.tab!=='devices');document.querySelector('#accountView').classList.toggle('hidden',t.dataset.tab!=='account')}));render();
  </script>
</body>
</html>
