<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5faff" />
  <title>账号登录 - 星云有客</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#252a34;background:#f5faff;font-synthesis:none;text-rendering:optimizeLegibility;--blue:#2875f4;--muted:#8a93a2;--line:#e5e9ef}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(ellipse at 17% 75%,#eef6ff 0,transparent 39%),#f6fbff}.page{min-height:100vh;display:flex;flex-direction:column;padding:20px clamp(28px,6vw,112px) 24px}.main{width:min(1400px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(450px,.92fr);align-items:center;gap:clamp(48px,8vw,150px);padding:24px 0 58px}.intro{position:relative;padding:0 0 0 8px}.intro-copy{margin-left:12%;margin-bottom:70px;position:relative;z-index:1}.intro-copy p{margin:0 0 12px;color:#949ba5;font-size:20px;letter-spacing:.5px}.intro-copy h1{margin:0;color:#30343b;font-size:28px;font-weight:650;letter-spacing:1px}.art{width:min(100%,670px);max-height:390px;height:auto;object-fit:contain;margin:0 auto;display:block;filter:drop-shadow(0 12px 18px rgba(58,94,150,.06))}.login-card{width:100%;max-width:520px;justify-self:end;padding:52px 54px 44px;background:#fff;border:1px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:0 16px 46px rgba(63,100,147,.10)}.card-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e2e6;height:44px;margin-bottom:28px}.card-title{height:44px;display:flex;align-items:center;border-bottom:3px solid #30343b;font-size:20px;font-weight:650}.register{font-size:14px;color:#707783;white-space:nowrap}.register a,.forgot,.terms a{color:var(--blue);text-decoration:none}.register a{font-size:16px;margin-left:8px}.field{height:64px;border-bottom:1px solid #e3e6eb;display:grid;grid-template-columns:94px 1fr;align-items:center;gap:12px}.field label{font-size:15px;color:#444b55}.field input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:#242a33;padding:12px 0}.field input::placeholder{color:#c1c7d0}.field:focus-within{border-color:#4c8cf8}.field-inline{position:relative}.field-inline .forgot{position:absolute;right:0;font-size:14px}.field-inline input{padding-right:86px}.options{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 0 32px;color:#87909e;font-size:13px}.terms,.remember{display:flex;align-items:flex-start;gap:8px;line-height:1.6}.terms input,.remember input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--blue);flex-shrink:0}.terms{max-width:78%}.remember{white-space:nowrap}.primary,.wecom{width:100%;height:54px;border-radius:4px;font:inherit;font-size:17px;letter-spacing:6px;cursor:pointer}.primary{border:0;color:#fff;background:linear-gradient(105deg,#5b52f2,#2877f5);box-shadow:0 8px 20px rgba(59,112,247,.24);transition:filter .15s,transform .15s}.primary:hover{filter:brightness(1.04);transform:translateY(-1px)}.wecom{margin-top:18px;border:1px solid #d7dbe1;background:#fff;color:#555e68;letter-spacing:0}.wecom:hover{background:#fafcff;border-color:#c7d3e6}.wecom-icon{color:#17a864;margin-right:9px}.footer{margin-top:auto;text-align:center;color:#9299a4;font-size:13px;letter-spacing:.2px;padding:16px 0 2px}.notice{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e3e8f0;box-shadow:0 8px 24px #21334a1c;border-radius:8px;padding:12px 18px;color:#465161;font-size:14px;z-index:5}.notice[hidden]{display:none}.modal-backdrop{position:fixed;inset:0;background:rgba(28,39,56,.42);display:grid;place-items:center;padding:20px;z-index:4}.modal-backdrop[hidden]{display:none}.modal{width:min(400px,100%);background:white;border-radius:12px;padding:28px;text-align:center;box-shadow:0 20px 60px #1c273833}.modal h2{font-size:19px;margin:0 0 10px}.modal p{font-size:14px;color:#7d8795;line-height:1.7;margin:0}.qr-placeholder{width:172px;height:172px;margin:18px auto 13px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:#7c8795;background:#fff;font-size:12px}.qr-pattern{width:136px;height:136px;display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(17,1fr);gap:2px;padding:3px}.qr-pattern i{background:#17212d;border-radius:1px}.qr-pattern i:nth-child(3n),.qr-pattern i:nth-child(7n+2){background:#fff}.qr-status{color:#586473;font-size:13px;margin:8px 0 16px}.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.modal button{min-height:36px;padding:0 18px;border:1px solid #dfe4eb;border-radius:6px;background:white;color:#4e5868;cursor:pointer}.modal button.primary-action{border-color:var(--blue);background:var(--blue);color:#fff}.mock-note{font-size:11px!important;color:#a0a7b2!important;margin-top:15px!important}.success-card{max-width:520px;justify-self:end;width:100%;padding:72px 48px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 16px 46px rgba(63,100,147,.10)}.success-mark{width:58px;height:58px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:#eaf8f0;color:#22a06b;font-size:31px}.success-card h2{margin:0 0 10px;font-size:23px}.success-card p{margin:0 0 28px;color:#7d8795;font-size:14px}.success-card button{height:42px;padding:0 26px;background:var(--blue);border:0;border-radius:5px;color:#fff;font:inherit;cursor:pointer}
    .modal-backdrop[hidden]{display:none}
    @media(max-width:980px){.page{padding:24px 30px}.main{grid-template-columns:1fr;gap:34px;max-width:560px;padding:48px 0 36px}.intro{display:none}.login-card,.success-card{justify-self:center}.footer{font-size:12px}}
    @media(max-width:540px){.page{padding:22px 16px 18px}.main{padding:44px 0 28px}.login-card{padding:32px 22px 26px;border-radius:14px}.success-card{padding:52px 24px;border-radius:14px}.card-title{font-size:18px}.register{font-size:12px}.register a{font-size:14px}.field{grid-template-columns:78px 1fr;gap:8px;height:60px}.field label{font-size:14px}.field input{font-size:14px}.options{font-size:12px;gap:8px}.terms{max-width:74%}.remember{gap:5px}.primary,.wecom{height:50px;font-size:15px}.footer{line-height:1.7}}
  </style>
</head>
<body>
  <div class="page">
    <main class="main">
      <section class="intro" aria-label="产品介绍">
        <div class="intro-copy"><p>打通全渠道数据，精准引流获客，数据化圈层运营</p><h1>打造私域一体化营销闭环</h1></div>
        <img class="art" src="https://s-test01.st.xyyouke.cn/img/loginM.bd97bb63.png" alt="星云有客产品介绍插画" />
      </section>
      <section class="login-card" id="loginCard" aria-label="账号登录">
        <div class="card-head"><div class="card-title">账号登录</div><div class="register">还没有账号？<a href="#register" id="registerLink">免费注册</a></div></div>
        <form id="loginForm" novalidate>
          <div class="field"><label for="phone">手机号码</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="请输入手机号码" maxlength="11" /></div>
          <div class="field field-inline"><label for="password">登录密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" /><a class="forgot" href="#forgot" id="forgotLink">忘记密码？</a></div>
          <div class="options"><label class="terms"><input id="terms" type="checkbox" /><span>阅读并同意 <a href="#user-policy">用户协议</a>、<a href="#privacy-policy">隐私政策</a></span></label><label class="remember"><input type="checkbox" /><span>记住我</span></label></div>
          <button class="primary" type="submit">登 录</button>
          <button class="wecom" type="button" id="wecomButton"><span class="wecom-icon">◉</span>企业微信登录</button>
        </form>
      </section>
    </main>
    <footer class="footer">©2020-2026 杭州星云智慧科技有限公司 All Rights Reserved.　浙ICP备2020039376号-3</footer>
  </div>
  <div class="notice" id="notice" role="status" hidden></div>
  <div class="modal-backdrop" id="verifyModal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="verifyTitle"><h2 id="verifyTitle">企微扫码验证</h2><p id="verifyDescription">为保障您的账号安全，请使用该企业的员工账号扫码验证。</p><div class="qr-placeholder"><div class="qr-pattern" aria-hidden="true"></div></div></section></div>
  <script>
    const notice=document.querySelector('#notice');let noticeTimer;
    function showNotice(message){notice.textContent=message;notice.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.hidden=true,2600)}
    const verifyModal=document.querySelector('#verifyModal');
    const qrPattern=document.querySelector('.qr-pattern');for(let i=0;i<289;i++)qrPattern.appendChild(document.createElement('i'));
    function openVerification(){document.querySelector('#verifyTitle').textContent='企微扫码验证';document.querySelector('#verifyDescription').textContent='为保障您的账号安全，请使用该企业的员工账号扫码验证。';verifyModal.hidden=false}
    document.querySelector('#loginForm').addEventListener('submit',event=>{event.preventDefault();const phone=document.querySelector('#phone').value.trim();const password=document.querySelector('#password').value;if(!/^\d{11}$/.test(phone)){showNotice('请输入正确的 11 位手机号码');return}if(!password){showNotice('请输入登录密码');return}if(!document.querySelector('#terms').checked){showNotice('请先阅读并同意用户协议和隐私政策');return}openVerification()});
    document.querySelector('#wecomButton').addEventListener('click',openVerification);
    verifyModal.addEventListener('click',event=>{if(event.target===verifyModal)verifyModal.hidden=true});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!verifyModal.hidden)verifyModal.hidden=true});
    document.querySelectorAll('#registerLink,#forgotLink').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();showNotice('演示页面未连接此服务')}));
  </script>
</body>
</html>
